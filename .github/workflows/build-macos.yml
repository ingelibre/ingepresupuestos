name: Build macOS (beta)

# Versión de PRUEBA para Mac, a pedido de usuarios de Mac (nov-2026).
# Solo se lanza a mano (pestaña Actions ▸ Build macOS (beta) ▸ Run workflow):
# todavía no sale con los tags, hasta que los usuarios de Mac confirmen que
# funciona. Entonces se añade `push: tags: ['v*']` y se sube a la release.
#
# Dos paquetes: Apple Silicon (arm64, M1–M4) e Intel (x86_64). Sin firma de
# Apple: la primera vez se abre con clic derecho ▸ Abrir (o Ajustes del
# Sistema ▸ Privacidad y seguridad ▸ «Abrir igualmente»).
#
# Con «publicar = true», los .dmg se suben a una pre-release `mac-beta` con
# enlace público, para que los probadores los descarguen sin cuenta de
# GitHub. Con «false» solo quedan como artefactos del run.
on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Subir los .dmg a la pre-release pública mac-beta"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  dmg:
    name: .app + .dmg (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false          # si un Mac falla, el otro sigue
      matrix:
        include:
          - runner: macos-15        # Apple Silicon
            arch: arm64
          - runner: macos-15-intel  # Intel
            arch: x86_64

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      # pyodbc (importador de PowerCost, solo al usarlo) enlaza con unixODBC.
      - name: unixODBC
        run: brew install unixodbc

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Igual que en Windows: el modelo RAG se baja de R2; si no está, la app
      # usa la búsqueda difusa (Fase 1).
      - name: Descargar modelo RAG (model2vec) desde R2
        run: |
          mkdir -p resources/models
          if curl -fsSL "https://downloads.ingepresupuestos.com/models/potion-multilingual-128M.tar.gz" -o "$RUNNER_TEMP/m2v.tar.gz"; then
            tar -xzf "$RUNNER_TEMP/m2v.tar.gz" -C resources/models/ && echo "modelo RAG OK"
          else
            echo "::warning::modelo RAG no disponible en R2 — el binario saldrá sin Fase 2 (usa fuzzy)"
          fi

      - name: Compilar con PyInstaller
        run: pyinstaller ingepresupuestos.spec --noconfirm

      - name: Versión
        id: ver
        run: |
          VERSION=$(grep '^CURRENT_VERSION' core/update_manager.py | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión: $VERSION"

      # Arranque sin pantalla: si falta una librería o un recurso, el proceso
      # muere en los primeros segundos. Seguir vivo a los 20 s = arrancó.
      - name: Prueba de arranque
        run: |
          APP=dist/ingepresupuestos.app/Contents/MacOS/ingepresupuestos
          test -x "$APP"
          QT_QPA_PLATFORM=offscreen "$APP" > "$RUNNER_TEMP/arranque.log" 2>&1 &
          PID=$!
          sleep 20
          if kill -0 "$PID" 2>/dev/null; then
            echo "arrancó y sigue vivo a los 20 s"; kill "$PID" || true
          else
            echo "::error::la app terminó antes de 20 s"; cat "$RUNNER_TEMP/arranque.log"; exit 1
          fi
          tail -20 "$RUNNER_TEMP/arranque.log" || true

      - name: Crear el .dmg
        run: |
          DMG="dist/IngePresupuestos-${{ steps.ver.outputs.version }}-macos-${{ matrix.arch }}.dmg"
          mkdir -p "$RUNNER_TEMP/dmg"
          cp -R dist/ingepresupuestos.app "$RUNNER_TEMP/dmg/IngePresupuestos.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "IngePresupuestos" -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO "$DMG"
          ls -la dist/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ingepresupuestos-macos-${{ matrix.arch }}
          path: dist/*.dmg

      - name: Subir a la pre-release mac-beta
        if: inputs.publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mac-beta >/dev/null 2>&1 || gh release create mac-beta --prerelease \
            --title "IngePresupuestos para Mac (beta de prueba)" \
            --notes "Versión de prueba para macOS. Apple Silicon (M1–M4): archivo arm64. Intel: archivo x86_64. Sin firma de Apple: la primera vez, clic derecho sobre la app ▸ Abrir. Cuéntanos si funciona respondiendo al correo con el que te llegó este enlace, o en https://github.com/ingelibre/ingepresupuestos/issues"
          gh release upload mac-beta dist/*.dmg --clobber
