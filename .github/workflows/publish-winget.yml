# Publica cada nueva versión en winget (microsoft/winget-pkgs).
#
# Desde el cierre del código (2026-08-07, repo privado) el manifiesto DEBE
# apuntar al .exe público en R2 (downloads.ingepresupuestos.com), NO a los
# assets del GitHub Release: en un repo privado esas URLs devuelven 404 para
# cualquiera que haga `winget install`. Por eso ya no se usa winget-releaser
# (siempre toma la URL del Release) sino `wingetcreate update` con la URL de
# R2 explícita. El .exe de R2 es byte-idéntico al del Release (lo sube el
# mismo build), así que el SHA256 que calcula wingetcreate es el correcto.
#
# REQUISITO (una sola vez): agregar el secret WINGET_TOKEN en
#   Settings → Secrets and variables → Actions
# Debe ser un Personal Access Token CLÁSICO con scope `public_repo` de una
# cuenta que tenga (o pueda crear) un fork de microsoft/winget-pkgs
# (tuxiasumari). Sin ese secret el job se salta (no rompe el release).
#
# POR QUÉ NO SE DISPARA CON `on: release` (aprendido en la v2.8.6):
# el Release lo crea `softprops/action-gh-release` con el GITHUB_TOKEN por
# defecto, y GitHub NO dispara workflows nuevos desde eventos generados con ese
# token (salvaguarda anti-recursión). El evento `release: released` no llegaba
# nunca y este workflow acumuló 0 ejecuciones. Por eso ahora:
#   · `workflow_dispatch` — lanzarlo a mano indicando el tag;
#   · `workflow_call`     — lo invoca build-windows.yml al terminar el Release,
#                           dentro de la misma ejecución (sin depender de eventos).
# Se conserva `on: release` por si algún día el Release se publica a mano desde
# la web (ese sí es un evento de usuario y dispararía el workflow).
name: Publicar en winget

on:
  release:
    types: [released]
  workflow_call:
    inputs:
      tag:
        description: 'Tag del Release a publicar (ej. v2.9.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag del Release a publicar (ej. v2.9.0)'
        required: true
        type: string

jobs:
  winget:
    # wingetcreate es .NET para Windows; komac sería la alternativa Linux.
    runs-on: windows-latest
    # El `if` DEBE mirar el secret, no solo el repo: sin WINGET_TOKEN la acción
    # falla en vez de saltarse, y un release verde acabaría marcado en rojo.
    # Los secrets no se pueden usar en `if` a nivel de job → se pasan por env.
    env:
      HAS_WINGET_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - name: Avisar si falta el token
        if: ${{ env.HAS_WINGET_TOKEN != 'true' }}
        shell: pwsh
        run: |
          Write-Output "::warning::Falta el secret WINGET_TOKEN - no se publica en winget."
          Write-Output "Crealo en Settings -> Secrets and variables -> Actions"
          Write-Output "(PAT clasico con scope public_repo, de una cuenta con fork de microsoft/winget-pkgs)."

      - name: Actualizar manifiesto y abrir PR en winget-pkgs (URL de R2)
        if: ${{ env.HAS_WINGET_TOKEN == 'true' }}
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag || github.event.release.tag_name }}'
          $ver = $tag.TrimStart('v')
          $url = "https://downloads.ingepresupuestos.com/$tag/ingepresupuestos-setup-$tag.exe"

          # Sanity check: el .exe debe estar YA subido a R2 (lo hace
          # build-windows.yml antes de invocar este workflow). Publicar un
          # manifiesto con URL muerta rompe `winget install` para todos.
          $head = Invoke-WebRequest -Method Head -Uri $url -UseBasicParsing
          if ($head.StatusCode -ne 200) { throw "El instalador no esta en R2: $url" }
          Write-Output "Instalador verificado en R2 ($($head.Headers.'Content-Length') bytes)"

          # wingetcreate standalone (sin instalación)
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update MarcoSumari.IngePresupuestos `
            --version $ver `
            --urls $url `
            --submit `
            --token '${{ secrets.WINGET_TOKEN }}'
